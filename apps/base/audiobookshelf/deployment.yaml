apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
     # securityContext:
     #   fsGroup: 33 # www-data group ID
     #   runAsUser: 33 # www-data group ID
     #   runAsGroup: 33 # www-data group ID
      containers:
        - name: audiobookshelf
          envFrom:
            - configMapRef:
              name: audiobookshelf-configmap
           # - secretRef:
           #    name: linkding-container-env
          image: advplyr/audiobookshelf:2.37.0
          ports:
            - containerPort: 3005
          #securityContext:
          #  allowPrivilegeEscalation: false
          #volumeMounts:
          #  - mountPath: /etc/linkding/data
          #    name: linkding-data
     # volumes:
     #   - name: linkding-data
     #     persistentVolumeClaim:
     #       claimName: linkding-data
