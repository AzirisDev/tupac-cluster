apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        fsGroup: 1000 # non-root user ID
        runAsUser: 1000 # non-root user ID
        runAsGroup: 1000 # non-root user ID
      containers:
        - name: audiobookshelf
          envFrom:
            - configMapRef:
               name: audiobookshelf-configmap
           # - secretRef:
           #    name: linkding-container-env
          image: advplyr/audiobookshelf:2.37.0
          ports:
            - containerPort: 3005
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /config
              subPath: config
            - name: audiobookshelf-data
              mountPath: /metadata
              subPath: metadata
      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data
