apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data group ID
        runAsGroup: 33 # www-data group ID
      containers:
        - name: linkding
          env:
            name: LD_SUPERUSER_NAME
            valueFrom: { secretKeyRef: { name: test-ld-secret, key: user } }
            name: LD_SUPERUSER_PASSWORD
            valueFrom: { secretKeyRef: { name: test-ld-secret, key: password } }
          image: sissbruecker/linkding:1.47.0
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /etc/linkding/data
              name: linkding-data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
